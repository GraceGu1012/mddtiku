<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨督督 · 知识内容工作台</title><link rel="stylesheet" href="/static/hz-ui-tokens.css"><link rel="stylesheet" href="/static/workbench.css"></head><body><header><button id="nav-toggle" type="button" aria-label="收起导航" aria-controls="nav" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><strong>墨督督 · 知识内容工作台</strong><span>本机内部版 · PostgreSQL · 多模型生成</span></header><div class="layout"><nav id="nav" aria-label="主导航"></nav><main id="app"><p>正在连接本机数据库…</p></main></div><div id="nav-backdrop" aria-hidden="true"></div><div id="toast" role="status"></div><script src="/static/pipeline.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={pending_review:'待审核',approved:'已入库',rejected:'已打回',deleted:'已归档',uploaded:'已上传',parsing:'解析中',parsed:'解析完成',failed:'失败',queued:'排队中',running:'执行中',completed:'任务完成',card:'知识卡',single_choice:'单选题',multiple_choice:'多选题',true_false:'判断题'};
const navs=[['home','工作台'],['materials','材料工作台'],['review','审核工作台'],['cards','正式卡片库'],['questions','正式题目库'],['jobs','任务与队列'],['settings','模型与提示词'],['usage','消耗与审核统计']];
let boot,materials=[],entries=[],current,selected=new Set(),view='home',dirty=false,reviewFilter='pending_review',filterKind='',query='',timer;
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',5000)}
async function api(path,data){const response=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json','X-CSRF-Token':boot.csrf},body:data===undefined?undefined:JSON.stringify(data)});const v=await response.json();if(!response.ok)throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v}
function badge(s){return `<span class="badge ${['approved','completed','parsed'].includes(s)?'ok':s==='failed'?'bad':['uploaded','deleted'].includes(s)?'neutral':''}">${esc(names[s]||s)}</span>`}
function title(t,sub){return `<h1>${t}</h1><p class="sub">${sub}</p>`}
function formatTime(t){return new Date(t).toLocaleString('zh-CN',{hour12:false})}
function sourceLinks(x){return (x.evidence.evidence||[]).map(e=>`<div class="quote"><a href="#source/${encodeURIComponent(x.material_id)}/${encodeURIComponent(e.source_id)}" target="_blank" rel="noopener">${esc(e.label||('字幕 '+e.num+' · '+e.start))} ↗</a><p>${esc(e.quote)}</p></div>`).join('')}
async function refresh(){boot=await api('bootstrap');materials=await api('materials')}
async function route(){try{if(dirty&&!confirm('有尚未保存的修改，确认离开吗？')){history.replaceState(null,'','#review');return}dirty=false;if(window.pipelineCleanup)window.pipelineCleanup();view=(location.hash.slice(1)||'home').split('/')[0];if(view==='generate')view='materials';$('#nav').innerHTML=navs.map(([id,text])=>`<a href="#${id}" class="${view===id?'active':''}">${text}</a>`).join('')+'<a href="/learn" target="_blank" rel="noopener">学员学习空间 ↗</a><small>正式库仅展示已通过审核的内容。<br>当前账号：本机审核人</small>';await refresh();if(view==='home')home();else if(view==='materials')await pipelinePage();else if(view==='preview')await previewPage();else if(view==='source')await sourcePage();else if(['review','cards','questions'].includes(view))await listPage();else if(view==='settings')await settingsPage();else if(view==='jobs')await jobsPage();else if(view==='usage')await usagePage();else home()}catch(e){toast(e.message)}}
let selectedModelId='',settingsTab='models';
function home(){const n=s=>boot.counts.find(x=>x.status===s)?.count||0;$('#app').innerHTML=title('让好内容进入题库','已生成的10条样本保留待审核；你的审核决定正式库内容。')+`<div class="info">当前进展：材料解析 → 首批生成 → <strong>人工审核</strong> → 正式入库。支持多模型生成；请先配置模型，再选择本次生成使用的模型。</div><div class="stats"><div><strong>${materials.length}</strong><small>已保存材料</small></div><div><strong>${materials.filter(x=>x.parse_state==='parsed').length}</strong><small>解析完成</small></div><div><strong>${n('pending_review')}</strong><small>待审核结果</small></div><div><strong>${n('approved')}</strong><small>正式入库</small></div></div><section class="panel"><h2>接下来，审核第一条内容</h2><p>对照原文，检查题干、答案和解释。编辑会保留 AI 原版，审核通过后才进入正式库。</p><div class="actions"><a class="button primary" href="#review">进入审核工作台</a><a class="button" href="#materials">查看材料</a></div></section><section class="panel"><h2>本轮能力边界</h2><p>支持 CSV、文字版 PDF、DOCX 的本地上传与解析；视频 ASR 和 DOC 转换尚未接入。单文件上限 500MB，解析与生成单任务排队执行。</p><p class="muted">原始10条来自当前对话模型，usage不可获取。新生成可选择已启用模型，须配置Key并设置每日调用上限。</p></section>`}
async function previewPage(){const id=decodeURIComponent(location.hash.split('/')[1]);const d=await api('materials/'+id+'/preview');$('#app').innerHTML=title('解析预览',esc(d.name))+`<div class="actions"><a href="#materials">← 返回材料</a><a href="/api/materials/${id}/file" target="_blank">原文件</a>${d.state==='parsed'?'<button id="confirm-parse" class="primary">'+(d.confirmed?'已确认，可重新核对':'确认解析结果')+'</button>':''}</div><p>${badge(d.state)} ${d.total} 个来源片段</p><div class="filters">${d.courses.length?'<select id="course">'+d.courses.map(c=>`<option>${c}</option>`).join('')+'</select>':''}<input id="start" type="number" min="1" value="1" aria-label="起始位置"><button id="load-preview">定位片段</button></div><div id="preview-chunks"></div><p class="muted">${esc(d.limitations.join('；'))} ${d.issues.length?'解析发现 '+d.issues.length+' 项异常，请核对。':''}</p>`;async function load(){const p=await api(`materials/${id}/preview?course=${$('#course')?.value||''}&start=${$('#start').value}&limit=20`);$('#preview-chunks').innerHTML=p.chunks.map(c=>`<div class="source-block"><a href="#source/${id}/${encodeURIComponent(c.source_id)}">${esc(c.label)}</a><p>${esc(c.text)}</p></div>`).join('')||'<p>此范围没有内容。</p>'}$('#load-preview').onclick=()=>load().catch(e=>toast(e.message));if($('#course'))$('#course').onchange=()=>{$('#start').value=1;load().catch(e=>toast(e.message))};if($('#confirm-parse'))$('#confirm-parse').onclick=async()=>{try{await api('materials/'+id+'/confirm',{});toast('已记录解析确认');route()}catch(e){toast(e.message)}};await load()}
async function sourcePage(){const [,mid,sid]=location.hash.slice(1).split('/');const d=await api(`materials/${mid}/source/${sid}`);$('#app').innerHTML=title('来源上下文',esc(d.material.name))+`<div class="actions"><button id="back">← 返回</button><a href="/api/materials/${mid}/file${d.selected.page?'#page='+d.selected.page:''}" target="_blank">查看原始文件${d.selected.page?'第 '+d.selected.page+' 页':''}</a></div><p class="muted">蓝色区域为本条引文所在的原始片段；原文未经AI改写。</p>`+d.context.map(c=>`<div class="source-block ${c.source_id===d.selected.source_id?'selected-source':''}"><strong>${esc(c.label)}</strong><p>${esc(c.text)}</p></div>`).join('');$('#back').onclick=()=>{if(history.length>1)history.back();else location.hash='materials'}}
async function listPage(){const library=view!=='review';let params=new URLSearchParams({library:String(library),q:query});if(library&&view==='cards')params.set('kind','card');else if(filterKind)params.set('kind',filterKind);if(!library&&reviewFilter)params.set('status',reviewFilter);entries=await api('items?'+params);if(view==='questions')entries=entries.filter(x=>x.kind!=='card');selected.clear();current=entries.find(x=>x.id===current?.id)||entries[0];$('#app').innerHTML=title(library?(view==='cards'?'正式卡片库':'正式题目库'):'审核工作台',library?'只展示已审核通过的内容；编辑后会自动回到待审核。':'原文、AI原版、人工修改和审核记录一起保留。')+`<div class="filters"><input id="query" placeholder="搜索题干或知识点" value="${esc(query)}" aria-label="搜索">${!library?`<select id="status"><option value="pending_review">待审核</option><option value="rejected">已打回</option><option value="approved">已入库</option><option value="">全部状态</option></select>`:''}<select id="kind"><option value="">全部题型</option>${['card','single_choice','multiple_choice','true_false'].map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select><button id="search">查询</button></div>${library?`<div class="actions"><a href="/api/export?kind=${view==='cards'?'card':filterKind||'single_choice'}&format=csv">导出 CSV</a><a href="/api/export?kind=${view==='cards'?'card':filterKind||'single_choice'}&format=xlsx">导出 Excel</a><span class="muted">题目导出按所选题型；未选时导出单选</span></div>`:`<details><summary>批量审核（存疑条目须逐条处理）</summary><label><input id="all" type="checkbox"> 选择本页全部</label><p><label><input id="batch-evidence" type="checkbox"> 我已逐条核对所选内容的原文依据</label></p><div class="actions"><button id="batch-approve">批量通过</button><select id="batch-reason">${['答案错误','解析牵强','题目重复','表述不清','材料不足'].map(s=>`<option>${s}</option>`).join('')}</select><button id="batch-reject">批量打回</button></div></details>`}<div class="split ${library?'':'review-split'}"><div class="item-list" id="item-list"></div><section class="editor" id="editor"></section></div>`;if($('#status')){$('#status').value=reviewFilter;$('#status').onchange=()=>{reviewFilter=$('#status').value;safeReload()}}$('#kind').value=filterKind;$('#kind').onchange=()=>{filterKind=$('#kind').value;safeReload()};$('#search').onclick=()=>{query=$('#query').value;safeReload()};if(!library){$('#all').onchange=e=>{selected=new Set(e.target.checked?entries.map(x=>x.id):[]);renderList()};$('#batch-approve').onclick=()=>batchReview('approve');$('#batch-reject').onclick=()=>batchReview('reject')}renderList();await renderEditor(library)}
function safeReload(){if(dirty&&!confirm('离开并放弃未保存修改？'))return;dirty=false;listPage().catch(e=>toast(e.message))}
function submittedTime(x){const date=x.created_at?new Date(x.created_at):null;return date&&!Number.isNaN(date.getTime())?date.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'未记录'}
function submittedLabel(x){return `<span class="submitted-time" title="首次进入待审核的时间，按北京时间显示">提交审核时间：<time ${x.created_at?'datetime="'+esc(x.created_at)+'"':''}>${esc(submittedTime(x))}</time></span>`}
function renderList(){const library=view!=='review';$('#item-list').innerHTML=entries.length?entries.map(x=>`<div class="list-row">${!library?`<input type="checkbox" data-select="${x.id}" ${selected.has(x.id)?'checked':''} aria-label="选择 ${esc(x.current.prompt)}">`:''}<button data-id="${x.id}" class="${x.id===current?.id?'active':''}"><strong>${esc(x.current.prompt)}</strong><span>${names[x.kind]} · ${x.evidence.answer_origin==='ai_inference'?'AI推理 · ':''}${x.suspect?'需重点复核 · ':''}${names[x.status]}</span>${!library?submittedLabel(x):''}</button></div>`).join(''):'<p class="muted">没有匹配内容</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('放弃未保存修改？'))return;dirty=false;current=entries.find(x=>x.id===b.dataset.id);renderList();renderEditor(library).catch(e=>toast(e.message))});document.querySelectorAll('[data-select]').forEach(i=>i.onchange=()=>i.checked?selected.add(i.dataset.select):selected.delete(i.dataset.select))}
function answerOrigin(x){const inferred=x.evidence.answer_origin==='ai_inference';return `<div class="info ${inferred?'warn':''}"><strong>${inferred?'AI 推理补全':'材料依据答案'} · ${x.status==='approved'?'已人工审核':'待人工核验'}</strong><p>${inferred?'材料未提供完整答案。下方引文仅定位题面/知识点；请独立核对推理、选项和结论，逐条填写复核说明。':'答案应能在材料中找到依据，请对照引文核验。'}</p></div>`}
function learningQuality(x){const q=x.evidence.learning_quality;if(!q)return '<div class="quality-note"><strong>2017—2026 真题覆盖：未核查</strong><p class="muted">历史样本尚未记录大纲映射与真题统计，不能视为0次覆盖。</p></div>';const c=q.coverage,status={not_verified:'未核查',partial:'已核验样本内统计',complete:'十年范围已核查'}[c.status]||'待核查';return `<section class="quality-note"><h3>考点与学习设计</h3><p>考查目标：${esc(q.objective)}</p><p>大纲归属：${q.outline?esc(q.outline.path||q.outline.title||q.outline.id):'待提供并确认大纲'}</p><p><strong>2017—2026 · ${status}</strong></p><p>覆盖题数：${c.question_count===null?'—（未核查）':c.question_count+' 道'} · 覆盖年数：${c.year_count===null?'—':c.year_count+' 年'}</p><p>年份：${c.years.length?c.years.join('、'):c.status==='not_verified'?'—（待核查）':'已核验范围内未检出'}</p>${c.reason?'<p class="muted">'+esc(c.reason)+'</p>':''}${c.references.map(r=>`<a class="evidence-link" href="#source/${encodeURIComponent(r.material_id)}/${encodeURIComponent(r.source_id)}" target="_blank" rel="noopener">${r.year} · ${esc(r.paper_id)} · 第${esc(r.question_number)}题 ↗</a>`).join('')}<p><strong>${{none:'未提供易错依据',source_explicit:'材料明确提醒的易错点',design_hypothesis:'潜在混淆点 · AI出题假设'}[q.misconception.basis]}</strong></p>${q.misconception.summary?'<p>'+esc(q.misconception.summary)+'</p>':''}${q.option_explanations.length?'<details><summary>逐项解析</summary>'+q.option_explanations.map(e=>`<div class="quote"><strong>${String.fromCharCode(65+e.index)}. ${esc(e.explanation)}</strong>${e.evidence.map(v=>`<p><a href="#source/${encodeURIComponent(x.material_id)}/${encodeURIComponent(v.source_id)}" target="_blank" rel="noopener">查看原文 ↗</a> ${esc(v.quote)}</p>`).join('')}</div>`).join('')+'</details>':''}<p class="muted">学习设计保留生成时的依据；修改题干、答案或选项后需重新复核对应关系。</p></section>`}
function contentForm(x){const c=x.current;return `<form id="edit-form"><label class="field">${x.kind==='card'?'正面问题':'题干'}<textarea name="prompt" required>${esc(c.prompt)}</textarea></label>${x.kind!=='card'?c.options.map((o,i)=>`<label class="field">选项 ${String.fromCharCode(65+i)}<input name="option${i}" value="${esc(o)}" required></label>`).join('')+`<label class="field">正确选项（如 A 或 A,C）<input name="letters" value="${c.answer_indices.map(i=>String.fromCharCode(65+i)).join(',')}" required></label>`:`<label class="field">背面答案<textarea name="answer" required>${esc(c.answer)}</textarea></label>`}<label class="field">AI解释 / 人工修订解释<textarea name="ai_explanation" required>${esc(c.ai_explanation)}</textarea></label><div class="row"><label class="field">难度<select name="difficulty">${['基础','中等','进阶'].map(d=>`<option ${d===c.difficulty?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">知识点（逗号分隔）<input name="tags" value="${esc(c.tags.join(','))}" required></label></div><label class="field">修改说明<input name="reason" placeholder="说明修改了什么" required></label><button class="primary" type="submit">保存修改，重新待审核</button></form>`}
async function renderEditor(library){const x=current;if(!x){$('#editor').innerHTML='<div class="panel empty"><strong>'+ (library?'正式库暂为空':'暂无待处理内容')+'</strong><p>'+(library?'到审核工作台逐条通过后，内容会显示在这里。':'可以调整筛选或生成新内容。')+'</p></div>';return}$('#editor').innerHTML=`<div class="panel"><div class="actions">${badge(x.status)}<span class="muted">${names[x.kind]} · 版本 ${x.version}</span>${x.suspect?'<span class="badge">重点复核</span>':''}</div>${!library?submittedLabel(x):''}${answerOrigin(x)}${library?`<div class="card-question">${esc(x.current.prompt)}</div>${x.current.options.map((o,i)=>`<p>${String.fromCharCode(65+i)}. ${esc(o)}</p>`).join('')}<button id="reveal">查看答案</button><div id="answer" class="hidden"><p class="answer">${esc(x.current.answer)}</p><p>${esc(x.current.ai_explanation)}</p></div><details><summary>修改此条（保存后重新审核）</summary>${contentForm(x)}</details>`:contentForm(x)}${learningQuality(x)}<h3>${x.evidence.answer_origin==='ai_inference'?'题面 / 知识点来源（不是答案证据）':'材料原文引用'}</h3>${sourceLinks(x)}<p class="review-note">${esc(x.check_note)}。自动核验不能替代人工判断。</p><details><summary>AI生成原版与来源版本</summary><pre>${esc(JSON.stringify(x.original,null,2))}</pre><p class="muted">批次 ${esc(x.batch_id)}<br>原文件指纹 ${esc(x.evidence.material_sha256)}</p></details><details id="history"><summary>修改与审核历史</summary><div id="history-rows">加载中…</div></details><hr style="border:0;border-top:1px solid var(--hz-color-border)"><label><input type="checkbox" id="evidence-confirmed"> ${x.evidence.answer_origin==='ai_inference'?'已独立核验AI推理答案、推导过程及全部选项':'已对照原文，确认答案与解析有依据'}</label><label class="field">复核说明（重点复核条目至少8字）<textarea id="review-note" placeholder="请说明核对结论及依据；AI推理答案需独立验证，不能只确认引文存在"></textarea></label><div class="actions">${x.status==='pending_review'?'<button id="approve" class="primary">审核通过并入库</button><select id="reject-reason">'+['答案错误','解析牵强','题目重复','表述不清','材料不足'].map(s=>`<option>${s}</option>`).join('')+'</select><button id="reject">打回</button>':'<button id="restore">退回待审核</button>'}<button id="delete" class="danger">归档删除</button></div></div>`;if($('#reveal'))$('#reveal').onclick=()=>{$('#answer').classList.remove('hidden');$('#reveal').hidden=true};$('#edit-form').oninput=()=>dirty=true;$('#edit-form').onsubmit=saveEdit;if($('#approve'))$('#approve').onclick=()=>singleReview('approve');if($('#reject'))$('#reject').onclick=()=>singleReview('reject');if($('#restore'))$('#restore').onclick=()=>singleReview('restore');$('#delete').onclick=()=>singleReview('delete');const h=await api('items/'+x.id+'/history');if(current?.id!==x.id)return;$('#history-rows').innerHTML=h.length?h.map(a=>`<details><summary>${esc(formatTime(a.created_at))} · ${esc(a.actor)} · ${esc(a.action)}</summary><p>${esc(a.reason)}</p><pre>修改前：${esc(JSON.stringify(a.before_data,null,2))}\n修改后：${esc(JSON.stringify(a.after_data,null,2))}</pre></details>`).join(''):'<p class="muted">暂无人工操作记录。</p>'}
async function saveEdit(e){e.preventDefault();try{const f=new FormData(e.target),c={prompt:f.get('prompt'),answer:f.get('answer')||'',ai_explanation:f.get('ai_explanation'),difficulty:f.get('difficulty'),tags:f.get('tags').split(/[,，]/).map(x=>x.trim()).filter(Boolean),options:[],answer_indices:[]};if(current.kind!=='card'){c.options=current.current.options.map((_,i)=>f.get('option'+i));c.answer_indices=f.get('letters').toUpperCase().split(/[,，]/).map(s=>s.trim().charCodeAt(0)-65).sort();c.answer=c.answer_indices.map(i=>String.fromCharCode(65+i)+'. '+c.options[i]).join('；')}const r=await api('items/'+current.id+'/edit',{version:current.version,content:c,reason:f.get('reason')});dirty=false;toast(r.changed?'修改已保存，原版和历史保留':'内容没有变化');await refresh();await listPage()}catch(e){toast(e.message)}}
async function singleReview(action){if(dirty)return toast('请先保存修改，再执行审核');if(action==='delete'&&!confirm('确认归档删除这一条？正式库将隐藏，原版与历史仍保留。'))return;try{await api('review',{items:[{id:current.id,version:current.version}],action,reason:action==='reject'?$('#reject-reason').value:$('#review-note').value,evidence_confirmed:$('#evidence-confirmed').checked,confirm_delete:action==='delete'});toast('操作已保存到数据库');await refresh();await listPage()}catch(e){toast(e.message)}}
async function batchReview(action){if(dirty)return toast('请先保存编辑');if(!selected.size)return toast('请先选择条目');if(!confirm(`确认对所选 ${selected.size} 条执行${action==='approve'?'审核通过':'打回'}？`))return;try{await api('review',{items:entries.filter(x=>selected.has(x.id)).map(x=>({id:x.id,version:x.version})),action,reason:action==='reject'?$('#batch-reason').value:'已逐条对照原文复核',evidence_confirmed:$('#batch-evidence').checked});toast('批量操作已保存');await refresh();await listPage()}catch(e){toast(e.message)}}
async function settingsPage(){
 const requested=location.hash.split('/')[1];if(['models','limits','prompts'].includes(requested))settingsTab=requested;await refresh();const ps=await api('prompts'),s=boot.settings.value;
 $('#app').innerHTML=title('模型与提示词','添加多个模型，生成时按需选择。Key输入后加密保存，不回显明文。')+`<div class="settings-tabs" role="tablist" aria-label="设置分类">${[['models','模型配置'],['limits','调用额度'],['prompts','提示词模板']].map(([id,label])=>`<button type="button" role="tab" id="tab-${id}" data-settings-tab="${id}" aria-controls="settings-${id}">${label}</button>`).join('')}</div><section class="panel settings-section" role="tabpanel" aria-labelledby="tab-models" id="settings-models"><div class="actions" style="justify-content:space-between"><h2>模型管理</h2><button id="add-model" class="primary">＋ 添加模型</button></div><p class="muted">兼容 Chat Completions 接口；Base URL 与模型ID请以供应商后台为准。</p><div id="model-list">${boot.models.map(m=>`<div class="model-row"><div><strong>${esc(m.name)}</strong> <span class="muted">${esc(m.provider)}</span><p class="muted">${esc(m.model)} · ${esc(m.key_display)} · ${m.enabled?'已启用':'已停用'} · v${m.version}</p></div><div class="actions"><button data-edit-model="${m.id}">编辑</button><button data-toggle-model="${m.id}">${m.enabled?'停用':'启用'}</button></div></div>`).join('')}</div><div id="model-editor"></div></section><section class="panel settings-section" role="tabpanel" aria-labelledby="tab-limits" id="settings-limits"><h2>每日总调用上限</h2><form id="settings-form"><label class="field">所有模型合计<input name="daily_call_limit" type="number" min="0" max="1000" value="${s.daily_call_limit}" required></label><p class="muted">0 表示暂停；统一流水线每批预留4次（分析＋知识点＋生成＋核验）。更换模型不会重置当日额度。</p><button class="primary">保存调用上限</button></form></section><section class="panel settings-section" role="tabpanel" aria-labelledby="tab-prompts" id="settings-prompts"><h2>生成提示词 · 当前 v${ps[0].id}</h2><p class="quality-note">考查区间：2017—2026。大纲及真题对照未齐时保留“未核查”，不生成虚构频次；易错假设与材料依据分开。</p><form id="prompt-form"><textarea id="prompt-text" style="min-height:300px" required>${esc(ps[0].content)}</textarea><p class="muted">新任务使用保存后的版本；已有任务保留提交时的模型与提示词。</p><button class="primary">保存为新版本</button></form><details><summary>版本历史（${ps.length}）</summary>${ps.map(p=>`<details><summary>v${p.id} · ${formatTime(p.created_at)}</summary><pre>${esc(p.content)}</pre><p class="muted">${p.sha256}</p></details>`).join('')}</details></section>`;
 function chooseSettings(tab){settingsTab=tab;history.replaceState(null,'','#settings/'+tab);document.querySelectorAll('[data-settings-tab]').forEach(b=>{const active=b.dataset.settingsTab===tab;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1});document.querySelectorAll('.settings-section').forEach(p=>p.hidden=p.id!=='settings-'+tab)}
 document.querySelectorAll('[data-settings-tab]').forEach(b=>{b.onclick=()=>chooseSettings(b.dataset.settingsTab);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=['models','limits','prompts'],i=ids.indexOf(settingsTab);const next=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;chooseSettings(ids[next]);$('#tab-'+ids[next]).focus()}});chooseSettings(settingsTab);
 $('#add-model').onclick=()=>modelEditor();document.querySelectorAll('[data-edit-model]').forEach(b=>b.onclick=()=>modelEditor(boot.models.find(x=>x.id===b.dataset.editModel)));
 document.querySelectorAll('[data-toggle-model]').forEach(b=>b.onclick=async()=>{const m=boot.models.find(x=>x.id===b.dataset.toggleModel);if(m.enabled&&!confirm('停用后不能提交新任务，已排队任务仍按原配置执行。确认停用？'))return;try{await api('models/'+m.id,modelPayload(m,{enabled:!m.enabled}));toast('模型状态已更新');settingsPage()}catch(e){toast(e.message)}});
 $('#settings-form').onsubmit=async e=>{e.preventDefault();try{await api('settings',{version:boot.settings.version,daily_call_limit:Number(new FormData(e.target).get('daily_call_limit'))});toast('调用上限已保存');settingsPage()}catch(e){toast(e.message)}};
 $('#prompt-form').onsubmit=async e=>{e.preventDefault();try{await api('prompts',{base_version:ps[0].id,content:$('#prompt-text').value});toast('提示词新版本已保存');settingsPage()}catch(e){toast(e.message)}};
}
function modelPayload(m,overrides={}){return {...Object.fromEntries(['version','name','provider','base_url','model','json_mode','enabled','input_price','output_price','currency'].map(k=>[k,m[k]])),...overrides}}
function modelEditor(existing){
 const m=existing||{name:'',provider:'DeepSeek',base_url:'https://api.deepseek.com',model:'deepseek-flash',json_mode:true,enabled:true,input_price:null,output_price:null,currency:'CNY'};
 $('#model-editor').innerHTML=`<hr style="border:0;border-top:1px solid var(--hz-color-border)"><h3>${existing?'编辑模型':'添加模型'}</h3><form id="model-form" autocomplete="off"><div class="row"><label class="field">显示名称<input name="name" value="${esc(m.name)}" placeholder="例如：日常出题模型" maxlength="100" required></label><label class="field">供应商<select name="provider">${boot.model_presets.map(p=>`<option ${p.provider===m.provider?'selected':''}>${esc(p.provider)}</option>`).join('')}</select></label></div><label class="field">Base URL<input name="base_url" type="url" value="${esc(m.base_url)}" placeholder="https://api.example.com/v1" required></label><p class="muted">填写接口根地址，不含 /chat/completions。只支持公网HTTPS；更换地址须重新填写对应Key。</p><label class="field">API 模型ID<input name="model" value="${esc(m.model)}" placeholder="填写账户可用的模型ID" required></label><label class="field">API Key ${m.key_configured?'（已配置，留空保留原Key）':'（可稍后补充）'}<input name="api_key" type="password" autocomplete="new-password" value="" placeholder="${m.key_configured?'留空不修改；输入新Key则替换':'粘贴 API Key，输入内容将隐藏'}"></label><p class="muted">Key经服务端加密后写入数据库；保存后不会返回网页，也不会进入任务记录。</p><div class="actions"><label><input name="json_mode" type="checkbox" ${m.json_mode?'checked':''}>发送 JSON Mode 参数</label><label><input name="enabled" type="checkbox" ${m.enabled?'checked':''}>启用模型</label></div><p class="muted">若供应商不支持response_format，可关闭JSON Mode；输出仍须符合任务JSON结构。</p><details><summary>可选：费用预估单价</summary><div class="row"><label class="field">输入 / 百万token<input name="input_price" type="number" min="0" step="any" value="${m.input_price??''}"></label><label class="field">输出 / 百万token<input name="output_price" type="number" min="0" step="any" value="${m.output_price??''}"></label></div><label class="field">币种<select name="currency"><option ${m.currency==='CNY'?'selected':''}>CNY</option><option ${m.currency==='USD'?'selected':''}>USD</option></select></label></details><div class="actions"><button class="primary" type="submit">保存模型</button><button id="cancel-model" type="button">取消</button></div></form>`;
 $('#add-model').hidden=true;const form=$('#model-form');form.querySelector('[name=provider]').onchange=e=>{const p=boot.model_presets.find(x=>x.provider===e.target.value);form.elements.base_url.value=p.base_url;form.elements.model.value=p.model};$('#cancel-model').onclick=()=>{$('#model-editor').innerHTML='';$('#add-model').hidden=false};
 form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),payload={name:f.get('name'),provider:f.get('provider'),base_url:f.get('base_url'),model:f.get('model'),json_mode:f.has('json_mode'),enabled:f.has('enabled'),input_price:f.get('input_price')===''?null:Number(f.get('input_price')),output_price:f.get('output_price')===''?null:Number(f.get('output_price')),currency:f.get('currency')};if(existing)payload.version=existing.version;if(f.get('api_key'))payload.api_key=f.get('api_key');form.elements.api_key.value='';form.querySelector('[type=submit]').disabled=true;try{await api('models'+(existing?'/'+existing.id:''),payload);toast('模型已保存，Key不会回显');await settingsPage()}catch(e){toast(e.message);if($('#model-form'))$('#model-form [type=submit]').disabled=false}finally{delete payload.api_key;f.delete('api_key')}};
 $('#model-editor').scrollIntoView({block:'nearest'});
}
async function jobsPage(){const data=await api('jobs');$('#app').innerHTML=title('任务与队列','每次执行一个任务；失败原因保留，收费调用不自动重试。')+`<button id="refresh-jobs">刷新状态</button><div class="scroll"><table><thead><tr><th>材料 / 类型</th><th>状态</th><th>结果或原因</th><th>提交时间</th></tr></thead><tbody>${data.map(j=>`<tr><td>${esc(j.material_name)}<br>${j.kind==='parse'?'内容解析':'AI生成'}</td><td>${badge(j.state)}${j.state==='queued'?'<br>队列位置 '+(data.filter(x=>x.state==='queued').reverse().findIndex(x=>x.id===j.id)+1):''}</td><td>${esc(j.error||JSON.stringify(j.result||{}))}${j.kind==='generate'?'<details><summary>提交时的模型 / 提示词</summary><pre>'+esc(JSON.stringify(j.config,null,2))+'</pre></details>':''}</td><td>${formatTime(j.created_at)}</td></tr>`).join('')}</tbody></table></div>${data.length?'':'<section class="panel empty">暂无后台任务。首批10条为当前对话生成后导入，不伪造API任务。</section>'}<p><a href="#materials">失败解析可在材料列表重试</a> · <a href="#generate">重新选择生成范围</a></p>`;$('#refresh-jobs').onclick=()=>jobsPage().catch(e=>toast(e.message))}
async function usagePage(){const d=await api('usage');$('#app').innerHTML=title('消耗与审核统计','原始usage随调用保存；当前对话样本没有API计费数据。')+`<div class="info">${esc(d.note)}</div><section class="panel"><h2>人工审核操作</h2><p>${d.reviews.map(r=>`${r.action==='approve'?'通过':'打回'} ${r.count} 次`).join(' · ')||'尚无人工审核操作'}</p><p>${d.reject_reasons.map(r=>esc(r.reason)+' '+r.count+'次').join(' · ')}</p></section><div class="scroll"><table><thead><tr><th>模型 / 用途</th><th>原始usage</th><th>成本预估</th><th>时间</th></tr></thead><tbody>${d.calls.map(c=>`<tr><td>${esc(c.model)}<br>${esc(c.purpose)}</td><td><pre>${esc(JSON.stringify(c.usage,null,2))}</pre></td><td>${c.cost===null?'未配置单价':Number(c.cost).toFixed(6)+' '+c.currency}</td><td>${formatTime(c.created_at)}</td></tr>`).join('')}</tbody></table></div>${d.calls.length?'':'<p class="empty">暂无真实API调用记录</p>'}`}
const smallScreen=matchMedia('(max-width:900px)');let sidebarCollapsed=false;try{sidebarCollapsed=localStorage.getItem('mdd-sidebar-collapsed')==='true'}catch{}
function applyNavigation(open=false){const mobile=smallScreen.matches;document.body.classList.toggle('sidebar-collapsed',sidebarCollapsed&&!mobile);document.body.classList.toggle('menu-open',mobile&&open);const expanded=mobile?open:!sidebarCollapsed;$('#nav-toggle').setAttribute('aria-expanded',String(expanded));$('#nav-toggle').setAttribute('aria-label',expanded?'收起导航':'展开导航');$('#nav').inert=!expanded;$('#app').inert=mobile&&open;if(mobile&&open)$('#nav a')?.focus()}
function closeNavigation(){if(smallScreen.matches&&document.body.classList.contains('menu-open')){applyNavigation(false);$('#nav-toggle').focus()}}
$('#nav-toggle').onclick=()=>{if(smallScreen.matches)applyNavigation(!document.body.classList.contains('menu-open'));else{sidebarCollapsed=!sidebarCollapsed;try{localStorage.setItem('mdd-sidebar-collapsed',String(sidebarCollapsed))}catch{}applyNavigation()}};
$('#nav-backdrop').onclick=closeNavigation;$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))closeNavigation()});smallScreen.addEventListener('change',()=>applyNavigation(false));document.addEventListener('keydown',e=>{if(!smallScreen.matches||!document.body.classList.contains('menu-open'))return;if(e.key==='Escape'){e.preventDefault();closeNavigation()}if(e.key==='Tab'){const nodes=[$('#nav-toggle'),...document.querySelectorAll('#nav a')],i=nodes.indexOf(document.activeElement);e.preventDefault();nodes[(i+(e.shiftKey?nodes.length-1:1))%nodes.length].focus()}});applyNavigation();
window.addEventListener('hashchange',route);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});route();
