server {
    listen 4312 ssl;
    server_name 8.130.110.58;
    ssl_certificate /etc/mdd-knowledge/tls.crt;
    ssl_certificate_key /etc/mdd-knowledge/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic off;
    client_max_body_size 501m;
    error_page 497 =301 https://8.130.110.58:4312$request_uri;
    location / {
        proxy_pass http://127.0.0.1:14312;
        proxy_set_header Host 127.0.0.1:14312;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_redirect off;
    }
}
